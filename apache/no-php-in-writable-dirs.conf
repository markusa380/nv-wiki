# images/ and cache/ are the only directories under the web root that
# www-data can write to. PHP must not run there, or a file written there
# would become executable code. The images/.htaccess says the same, but
# AllowOverride None makes Apache ignore .htaccess files.
<IfModule php_module>
  <Directory /var/www/html/images>
    php_admin_flag engine off
  </Directory>
  <Directory /var/www/html/cache>
    php_admin_flag engine off
  </Directory>
</IfModule>
