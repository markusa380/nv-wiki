# Apache sees every request coming from Traefik's pod address. Traefik puts
# the visitor's address into X-Forwarded-For, and this makes Apache, PHP and
# MediaWiki use it. Only the pod network is trusted to set the header.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.42.0.0/16

# The image's "combined" format, with the visitor's address (%a), the
# request size including headers and body (%I) and the duration in
# microseconds (%D).
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %I %D" combined
