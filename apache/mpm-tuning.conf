# Overrides mods-available/mpm_prefork.conf, which apache2.conf includes
# before conf-enabled.
<IfModule mpm_prefork_module>
    # Upstream default is 0, meaning workers are never recycled and any
    # per-request leak accumulates until the container restarts. Worker RSS
    # was observed growing from ~14MB to ~108MB private over 11 hours.
    MaxConnectionsPerChild  1000

    # The upstream default of 150 does not fit the 500M container limit. After
    # subtracting shared memory, the master and slab, roughly 376M remains for
    # worker private memory, which is ~16 workers at observed sizes.
    # Steady-state concurrency is well under 1.
    MaxRequestWorkers        15
</IfModule>
