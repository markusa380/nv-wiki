# Overrides mods-available/mpm_prefork.conf, which apache2.conf includes
# before conf-enabled.
#
# Memory budget, measured 2026-09-08 against the 500M container limit:
#
#   shared memory (opcache 128M cap + APCu 32M)   69M, budget 100M
#   slab                                          10M
#   master process                                15M
#   shared libraries, counted once                22M
#   left for worker private heap                 ~340M
#
# Worker heap is a high-water mark, not a leak. PHP does not return heap to
# the kernel, so a worker stays at its largest size. A worker pinned at 81M
# took 90 further /load.php requests with 0K growth.
#
# The plateau comes from /load.php?modules=startup, which touches all 401
# registered modules: 18M retained for 39K of output, 0.79s against 0.046s
# for an ordinary module request. Workers that served one sit at 75-95M,
# others at 11-15M.
#
# The settings below limit how many workers reach the plateau and for how
# long. They do not reduce the plateau. That needs fewer modules or a
# server-side cache for the startup response.
<IfModule mpm_prefork_module>
    # Default 0 never recycles, so a worker holds 85M until the container
    # restarts. At 0.17 req/s, 1000 is ~16h of life and 250 is under 2h.
    # A recycled worker restarts at ~11M.
    MaxConnectionsPerChild  250

    # Defaults are 5/5/10. Ten workers at 85M need 850M and do not fit in
    # 340M. Three need 255M. Measured concurrency is 1-2 busy workers,
    # peaking at 4.
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          3

    # Burst ceiling, unchanged. Forked workers start at ~11M and only reach
    # the plateau by serving a startup request. Revisit if a crawler drives
    # many concurrent /load.php requests.
    MaxRequestWorkers        15
</IfModule>
