# Overrides mods-available/mpm_prefork.conf, which apache2.conf includes
# before conf-enabled.
#
# Sizing target is the 500M container limit. Measured on 2026-09-08 after
# 7d18h uptime, with memory.current pinned at 522M of 524M:
#
#   shared memory (opcache 128M cap + APCu 32M)   69M, budget 100M
#   slab                                          10M
#   master process                                15M
#   shared libraries, counted once                22M
#   ------------------------------------------------------------
#   left for worker private heap                 ~340M
#
# A worker's private heap ratchets upward to a plateau and stays there: PHP
# frees at end of request but the allocator does not return the memory to the
# kernel, so each worker is permanently sized to the largest thing it ever did.
# This is a high-water mark, not a leak -- a worker pinned at 81M was given 90
# further /load.php requests and grew by exactly 0K.
#
# The plateau is set by /load.php?modules=startup, the only endpoint that has
# to touch every registered module to build the client-side registry. Measured
# on the CLI, that response retains 18M of heap to emit 39K of output, 14M of
# it in version-hashing 401 modules; it takes 0.79s against 0.046s for an
# ordinary module request. Workers that have served one sit at 75-95M RssAnon,
# against 11-15M for workers that have not. So the levers below control how
# MANY workers can be at the plateau at once, and for how LONG -- not how big
# the plateau is. That would need fewer registered modules or a server-side
# cache for the startup response, neither of which is an Apache setting.
<IfModule mpm_prefork_module>
    # Upstream default is 0, meaning workers are never recycled and a worker
    # that reached the plateau holds 85M until the container restarts. At 1000
    # and the measured 0.17 req/s a worker lived ~16h; 250 brings that under
    # 2h. A recycled worker restarts at ~11M and only returns to the plateau
    # if it serves another startup request, which most workers never do.
    MaxConnectionsPerChild  250

    # Upstream defaults are 5/5/10, which keeps ten workers resident. Ten at
    # the 85M plateau need 850M and do not fit in 340M; three need 255M and
    # do. Measured concurrency is 1-2 busy workers, peaking at 4, so the idle
    # pool was oversized by roughly 5x regardless.
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          3

    # Burst ceiling, unchanged. Workers forked into a burst start near 11M and
    # reach the plateau only by serving a startup request, so the burst cost
    # is well below 15 x 85M. Worth revisiting if a crawler ever drives many
    # concurrent /load.php requests.
    MaxRequestWorkers        15
</IfModule>
