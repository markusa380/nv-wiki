# Replaces the image's conf-available/short-url.conf. Identical to the
# original except for the /server-status exclusion, without which the rewrite
# swallows the mod_status page.
<Directory /var/www/html>
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/server-status
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^ %{DOCUMENT_ROOT}/index.php [L]
</Directory>
