; APCu is the in-memory cache that MediaWiki uses as CACHE_ACCEL. The segment
; is allocated once and counts against the container's memory budget in
; apache/mpm-tuning.conf.
apc.shm_size = 32M

; When the cache is full, evict entries idle for longer than this. With 0,
; APCu wipes the whole cache instead.
apc.ttl = 3600
